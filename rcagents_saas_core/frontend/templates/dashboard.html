{% extends "dashboard_base.html" %}
{% block content %}
<div x-data="{
    view: 'overview',
    loading: true,
    storeId: '1',

    // API data buckets
    stats: {},
    ordersList: [],
    products: [],
    clients: [],
    salesByChannel: {},
    aiBrain: {},
    conversations: [],
    convMessages: [],

    // UI state
    selectedConvId: null,
    searchQuery: '',
    orderSearch: '',
    orderStatusFilter: '',
    loadingMessages: false,

    // Agents state
    agents: [],
    editingAgent: null,
    editingPrompt: '',
    savingAgent: false,
    agentSaved: false,

    // Chat state
    chatSearch: '',
    chatPlatform: '',

    async init() {
        const params = new URLSearchParams(window.location.search);
        const v = params.get('view');
        if (v) this.view = v;

        const sid = this.storeId;

        try {
            const [statsRes, ordersRes, productsRes, clientsRes, salesRes, brainRes] = await Promise.all([
                fetch(`/api/stats?store_id=${sid}`).then(r => r.json()).catch(() => ({})),
                fetch(`/api/orders?store_id=${sid}&limit=100`).then(r => r.json()).catch(() => ({orders: []})),
                fetch(`/api/products?store_id=${sid}`).then(r => r.json()).catch(() => ({products: [], total: 0})),
                fetch(`/api/clients?store_id=${sid}`).then(r => r.json()).catch(() => ({clients: [], total: 0})),
                fetch(`/api/stats/sales-by-channel?store_id=${sid}`).then(r => r.json()).catch(() => ({channels: []})),
                fetch(`/api/stats/ai-brain?store_id=${sid}`).then(r => r.json()).catch(() => ({configured: false}))
            ]);

            this.stats = statsRes;
            this.ordersList = (ordersRes.orders && ordersRes.orders.length > 0) ? ordersRes.orders : (window.MOCK_ORDERS || []);
            this.products = (productsRes.products && productsRes.products.length > 0) ? productsRes.products : (window.MOCK_PRODUCTS || []);
            this.clients = (clientsRes.clients && clientsRes.clients.length > 0) ? clientsRes.clients : (window.MOCK_CLIENTS || []);
            this.salesByChannel = salesRes;
            this.aiBrain = brainRes;
        } catch (e) {
            console.error('Dashboard init error, using mock:', e);
            this.ordersList = window.MOCK_ORDERS || [];
            this.products = window.MOCK_PRODUCTS || [];
            this.clients = window.MOCK_CLIENTS || [];
        }

        // Load agents
        this.loadAgents();

        // Load conversations for chat
        this.loadConversations();

        this.loading = false;

        // Auto-refresh conversations every 10 seconds
        setInterval(() => {
            if (this.view === 'chat') {
                this.loadConversations();
            }
        }, 10000);
    },

    async loadAgents() {
        try {
            const res = await fetch(`/api/agents/prompts?store_id=${this.storeId}`);
            const data = await res.json();
            if (data.success) this.agents = data.agents;
        } catch (e) {
            console.error('Load agents error:', e);
        }
    },

    openAgentEditor(agent) {
        this.editingAgent = agent;
        this.editingPrompt = agent.prompt || '';
        this.agentSaved = false;
    },

    closeAgentEditor() {
        this.editingAgent = null;
        this.editingPrompt = '';
        this.agentSaved = false;
    },

    async saveAgentPrompt() {
        if (!this.editingAgent) return;
        this.savingAgent = true;
        try {
            const res = await fetch('/api/agents/prompts', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    store_id: this.storeId,
                    agent_type: this.editingAgent.type,
                    prompt: this.editingPrompt
                })
            });
            const data = await res.json();
            if (data.success) {
                this.agentSaved = true;
                // Update local agent data
                const idx = this.agents.findIndex(a => a.type === this.editingAgent.type);
                if (idx !== -1) {
                    this.agents[idx].prompt = this.editingPrompt;
                    this.agents[idx].is_default = false;
                }
                setTimeout(() => this.closeAgentEditor(), 1500);
            } else {
                alert('Error saving: ' + (data.error || 'unknown'));
            }
        } catch (e) {
            console.error('Save agent error:', e);
            alert('Network error saving prompt');
        } finally {
            this.savingAgent = false;
        }
    },

    resetAgentPrompt(agent) {
        if (!confirm('Reset this agent to default prompt?')) return;
        this.editingAgent = agent;
        this.editingPrompt = ''; // Reset triggers default on backend
        this.saveAgentPrompt();
    },

    async loadConversations() {
        try {
            const params = new URLSearchParams({store_id: this.storeId, limit: '50'});
            if (this.chatPlatform) params.set('platform', this.chatPlatform);
            const res = await fetch(`/api/messages?${params}`);
            const data = await res.json();
            this.conversations = data.conversations || [];
        } catch (e) {
            console.error('Load conversations error:', e);
            this.conversations = [];
        }
    },

    async loadConversationMessages(convId) {
        this.selectedConvId = convId;
        this.loadingMessages = true;
        this.convMessages = [];
        try {
            const res = await fetch(`/api/conversations/${this.storeId}/${convId}/messages`);
            const data = await res.json();
            this.convMessages = data.messages || [];
            this.$nextTick(() => {
                const container = document.getElementById('chat-messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            });
        } catch (e) {
            console.error('Load messages error:', e);
            this.convMessages = [];
        } finally {
            this.loadingMessages = false;
        }
    },

    filteredOrders() {
        let items = this.ordersList;
        if (this.orderStatusFilter) {
            items = items.filter(o => o.status === this.orderStatusFilter);
        }
        if (this.orderSearch) {
            const q = this.orderSearch.toLowerCase();
            items = items.filter(o =>
                (o.customer||'').toLowerCase().includes(q) ||
                (o.phone||'').toLowerCase().includes(q) ||
                (o.product||'').toLowerCase().includes(q)
            );
        }
        return items;
    },
    get channelColors() {
        return {
            messenger: { bg: 'from-blue-500/10 to-blue-600/5', text: 'text-blue-400', border: 'border-blue-500/20', icon: 'fab fa-facebook-messenger' },
            instagram: { bg: 'from-pink-500/10 to-purple-600/5', text: 'text-pink-400', border: 'border-pink-500/20', icon: 'fab fa-instagram' },
            whatsapp: { bg: 'from-emerald-500/10 to-green-600/5', text: 'text-emerald-400', border: 'border-emerald-500/20', icon: 'fab fa-whatsapp' }
        };
    },

    channelStyle(ch) {
        return this.channelColors[ch] || { bg: 'from-gray-500/10 to-gray-600/5', text: 'text-gray-400', border: 'border-gray-500/20', icon: 'fa-solid fa-comment' };
    },

    formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleDateString('fr-DZ', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    },

    statusBadge(status) {
        const s = (status || '').toLowerCase();
        if (s === 'paid' || s === 'confirme' || s === 'livre' || s === 'delivered') return 'bg-emerald-400/10 text-emerald-400 border-emerald-400/30';
        if (s === 'pending' || s === 'nouveau') return 'bg-yellow-400/10 text-yellow-400 border-yellow-400/30';
        if (s === 'annule' || s === 'cancelled' || s === 'failed') return 'bg-rose-400/10 text-rose-400 border-rose-400/30';
        if (s === 'processing' || s === 'shipped') return 'bg-sky-400/10 text-sky-400 border-sky-400/30';
        return 'bg-gray-500/10 text-gray-400 border-gray-500/30';
    },

    truncate(str, len = 60) {
        if (!str) return '—';
        return str.length > len ? str.slice(0, len) + '...' : str;
    }
}"

                                    </div>
                                </div>

                                <i class="fa-solid fa-spinner text-2xl mb-2 animate-spin"></i>
                                <p class="text-xs font-mono">Loading messages...</p>
                            </div>

                                <i class="fa-solid fa-inbox text-3xl mb-3 opacity-30"></i>
                                <p class="text-xs font-mono">No messages in this conversation</p>

                            <div x-show="!selectedConvId" class="text-center py-12 text-gray-500">
                                <i class="fa-solid fa-hand-pointer text-3xl mb-3 opacity-30"></i>
                                <p class="text-xs font-mono">Select a conversation to view messages</p>
                            </div>
                            <!-- Messages list -->
                            <div x-show="selectedConvId && !loadingMessages" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">

                                                    <img :src="m.image_url" class="max-w-full h-32 rounded-lg object-cover border border-rc-border/30" />

                                                </div>
                                            </template>

                                            </template>
                                            <div class="flex items-center justify-between mt-1.5">
                                                <span class="text-[8px] font-mono text-gray-600" x-text="m.role === 'user' ? 'Customer' : 'AI Bot'"></span>
                                                <span class="text-[9px] font-mono text-gray-600" x-text="formatDate(m.created_at)"></span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

                        <p class="text-xs text-gray-500 font-mono mt-1">Performance metrics and insights</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-4"><p class="text-[10px] font-mono text-gray-500">Active Conversations</p><p class="text-xl font-bold text-white font-mono mt-1" x-text="stats.active_conversations || 0"></p></div>
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-4"><p class="text-[10px] font-mono text-gray-500">Total Messages</p><p class="text-xl font-bold text-white font-mono mt-1" x-text="stats.total_messages || 0"></p></div>
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-4"><p class="text-[10px] font-mono text-gray-500">Messages Today</p><p class="text-xl font-bold text-white font-mono mt-1" x-text="stats.messages_today || 0"></p></div>

                <div class="bg-rc-card border border-rc-border/60 rounded-xl overflow-hidden card-hover-glow">
                    <div class="p-4 border-b border-rc-border/40"><h3 class="text-sm font-semibold text-white">Channel Performance</h3></div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs">
                            <thead><tr class="text-gray-500 font-mono text-[10px] border-b border-rc-border/40 bg-rc-card-hover/30">
                                <th class="text-left py-3 px-4 font-medium">Channel</th>
                                <th class="text-right py-3 px-4 font-medium">Conversations</th>
                                <th class="text-right py-3 px-4 font-medium">Messages (7d)</th>
                                <th class="text-right py-3 px-4 font-medium">Percentage</th>

                                    <tr class="border-b border-rc-border/20 hover:bg-rc-card-hover/30">
                                        <td class="py-3.5 px-4"><span class="text-xs text-gray-200" x-text="ch.label || ch.channel"></span></td>
                                        <td class="py-3.5 px-4 text-right"><span class="text-xs font-mono" x-text="ch.conversations || 0"></span></td>
                                        <td class="py-3.5 px-4 text-right"><span class="text-xs font-mono" x-text="(stats.messages_by_channel || {})[ch.channel] || 0"></span></td>
                                        <td class="py-3.5 px-4 text-right"><span class="text-xs font-mono text-neon-purple" x-text="ch.percentage + '%'"></span></td>
                                    </tr>
                                </template>
                                <template x-if="(salesByChannel.channels || []).length === 0">
                                    <tr><td colspan="4" class="py-8 text-center text-gray-500 text-xs font-mono">No channel data</td></tr>
                                </template>
                            </tbody>
                        </table>

                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">

                                <thead>
                                    <tr class="text-gray-500 font-mono text-[10px] border-b border-rc-border/40 bg-rc-card-hover/30">

                                    <template x-for="p in products.filter(x => !invSearch || x.title.toLowerCase().includes(invSearch.toLowerCase()))" :key="p.id">
